name: Build Succession iOS 7+ (.deb)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (ldid, Theos Linux iOS Toolchain & SDKs)
        run: |
          if ! command -v fakeroot >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y fakeroot dpkg curl xz-utils python3
          fi
          # Install ldid
          sudo curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          # Install Theos Linux iOS Clang Toolchain & Legacy SDKs (iPhoneOS9.3.sdk + iPhoneOS14.5.sdk)
          export THEOS=/opt/theos
          sudo mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          sudo chown -R "$USER:$USER" "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_PATH
          curl -sL https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma | tar --lzma -xf - --strip-components=1 -C "$THEOS/toolchain/linux/iphone"
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xzf - --strip-components=1 -C "$THEOS/sdks"
          # Install libtinfo5 for sbingner clang toolchain on Ubuntu 24.04+
          curl -sL http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb -o /tmp/libtinfo5.deb
          sudo dpkg -i /tmp/libtinfo5.deb
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Compile SuccessionRestore and package .deb
        run: |
          chmod +x ./compile
          ./compile

      - name: Verify .deb package & Mach-O slices (armv7, armv7s, arm64, arm64e)
        run: |
          ls -lh com.samgisaninja.successionrestore.deb
          dpkg-deb -I com.samgisaninja.successionrestore.deb
          dpkg-deb -c com.samgisaninja.successionrestore.deb
          mkdir -p /tmp/verify_deb
          dpkg-deb -x com.samgisaninja.successionrestore.deb /tmp/verify_deb
          "$THEOS/toolchain/linux/iphone/bin/lipo" -info /tmp/verify_deb/Applications/SuccessionRestore.app/SuccessionRestore
          "$THEOS/toolchain/linux/iphone/bin/lipo" -info /tmp/verify_deb/Applications/SuccessionRestore.app/succdatroot
          ldid -e /tmp/verify_deb/Applications/SuccessionRestore.app/SuccessionRestore

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.samgisaninja.successionrestore.deb
          path: com.samgisaninja.successionrestore.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.16-ios7
          name: "Succession 1.4.16~b4 (iOS 7.0 - 16.x Support)"
          body: |
            ### Succession Restore (`com.samgisaninja.successionrestore.deb`)
            - Hỗ trợ đầy đủ **iOS 7.0 – 7.1.2** (cả thiết bị **32-bit `armv7`/`armv7s`** và **64-bit `arm64`** như **iPhone 5s `iPhone6,1` / `iPhone6,2`**, iPad Air, iPad mini 2) cùng các bản iOS 8 – 16 (`arm64e`).
            - Sửa lỗi dùng `attach` thay vì `hdik` cho các thiết bị 64-bit chạy iOS 7 – 9.
            - Tương thích giao diện Storyboard & Alert/ActionSheet trên iOS 7.
            - Tự động lấy RootFS key qua `api.ipsw.me/v4`, `theapplewiki.com`, hoặc file `/var/mobile/Media/Succession/rfs_key.plist`.
          files: com.samgisaninja.successionrestore.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
